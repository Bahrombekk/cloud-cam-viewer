[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcam"
dynamic = ["version"]
description = "Watch and decrypt EZVIZ / Hik-Connect cloud cameras and Hikvision ISUP 5.0 devices from Python (H.264/H.265, encrypted streams)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ezviz", "hik-connect", "hikvision", "isup", "cctv", "rtsp", "camera", "hevc", "decrypt", "home-assistant", "frigate"]
authors = [{ name = "Bahrombek" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
    "Operating System :: OS Independent",
]
dependencies = [
    # Bulut transporti (VTM/VTDU) pyezvizapi 1.0.5.0 dan cloudcam/vtm/ ga ko'chirilgan
    # (Apache-2.0, cloudcam/vtm/LICENSE-pyezvizapi) — tashqi bog'liqlik emas.
    "numpy",
    "requests",
    "pycryptodome",
]

[project.optional-dependencies]
# Ko'rish (OpenCV) ixtiyoriy — yadro headless ishlaydi.
viewer = ["opencv-python"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/Bahrombekk/cloud-cam-viewer"
Source = "https://github.com/Bahrombekk/cloud-cam-viewer"
Issues = "https://github.com/Bahrombekk/cloud-cam-viewer/issues"
Changelog = "https://github.com/Bahrombekk/cloud-cam-viewer/blob/main/CHANGELOG.md"

[project.scripts]
# `pip install` dan keyin buyruq sifatida ishlatiladi.
cloudcam = "cloudcam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ko'chirilgan kodning litsenziyasi paket bilan birga tarqatilishi shart (Apache-2.0 §4).
"cloudcam.vtm" = ["LICENSE-pyezvizapi"]

[tool.setuptools.dynamic]
# Versiyaning yagona manbasi — src/cloudcam/__init__.py
version = { attr = "cloudcam.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E731"]   # lambda'ni o'zgaruvchiga berish — qisqa callback'lar uchun ataylab

[tool.ruff.lint.per-file-ignores]
# Skriptlar import'dan oldin stdout/logging ni sozlaydi.
"check_code.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
